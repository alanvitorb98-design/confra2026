name: Keep database awake

# Free Supabase projects pause after a week without traffic. The database also pings itself
# (pg_cron job "acordar-banco"); this is the backup from outside.
on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        run: |
          curl -fsS -X POST "https://optapzbhyhklcirdoyid.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_9PN8BMaKHBKkCdmIylVa-w_ajGUMRv3" -H "Content-Type: application/json" -d '{}'
