name: Keep database awake

# Free Supabase projects pause after a week without traffic. A tiny read every few days keeps it up until the party.
on:
  schedule:
    - cron: '17 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read the party config
        run: |
          curl -fsS "https://optapzbhyhklcirdoyid.supabase.co/rest/v1/event_config?select=test_mode" \
            -H "apikey: sb_publishable_9PN8BMaKHBKkCdmIylVa-w_ajGUMRv3"
