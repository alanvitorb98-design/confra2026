name: Keep database awake

# Free Supabase projects pause after a week without traffic, and free Hugging Face Spaces sleep after
# two days without visits. The database also pings itself (pg_cron job
# "acordar-banco"); this is the backup from outside.
on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        run: |
          curl -fsS -X POST "https://optapzbhyhklcirdoyid.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_9PN8BMaKHBKkCdmIylVa-w_ajGUMRv3" -H "Content-Type: application/json" -d '{}'
      - name: Keep the face server awake
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          [ -z "$HF_TOKEN" ] && { echo "No HF_TOKEN yet"; exit 0; }
          pip install -q huggingface_hub==0.26.2
          python - <<'PY'
          import os, urllib.request
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          user = api.whoami()["name"]
          repo = f"{user}/confra-rostos"
          try:
              stage = api.get_space_runtime(repo).stage
          except Exception as e:
              print("Space not found yet:", e); raise SystemExit(0)
          print("stage:", stage)
          if stage in ("SLEEPING", "PAUSED", "STOPPED"):
              api.restart_space(repo)
          req = urllib.request.Request(f"https://{user.lower()}-confra-rostos.hf.space/", headers={"Authorization": f"Bearer {os.environ['HF_TOKEN']}"})
          try:
              print(urllib.request.urlopen(req, timeout=60).read()[:200].decode())
          except Exception as e:
              print("visit:", e)
          PY
