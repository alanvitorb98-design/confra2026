name: Segurança

# Security scans. On every pull request: known flaws in the libraries the site ships (npm audit), insecure
# code patterns and leaked keys (Semgrep), and Snyk once its token is set. Every Monday and on demand:
# OWASP ZAP looks at the published site from the outside (passive scan: it reads pages, it attacks nothing).
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: read

concurrency:
  group: seguranca-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencias:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # what reaches the guests' phones: any high or critical flaw fails the check
      - run: npm audit --omit=dev --audit-level=high
      # build and test tools only run here and on a developer's machine: listed, not blocking
      - run: npm audit || true

  semgrep:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install semgrep==1.181.0
      - run: >
          semgrep scan --metrics=off --error
          --config p/javascript --config p/typescript --config p/react --config p/secrets --config p/github-actions
          src e2e supabase/functions scripts .github

  snyk:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Snyk (needs the SNYK_TOKEN secret)
        if: env.SNYK_TOKEN != ''
        run: npx --yes snyk@1 test --omit-dev --severity-threshold=high
      - name: Snyk code
        if: env.SNYK_TOKEN != ''
        run: npx --yes snyk@1 code test --severity-threshold=high
      - name: No Snyk token yet
        if: env.SNYK_TOKEN == ''
        run: echo "Snyk skipped - add the SNYK_TOKEN secret to turn it on."

  zap:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SITE: ${{ vars.SITE_URL || 'https://alanvitorb98-design.github.io/confra2026/' }}
    steps:
      # before the site is published there is nothing to scan
      - name: Site is up
        id: up
        run: |
          if curl -fsS -o /dev/null --max-time 20 "$SITE"; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "::notice::$SITE is not reachable, ZAP skipped"; fi
      - if: steps.up.outputs.ok == '1'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.up.outputs.ok == '1'
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ env.SITE }}
          allow_issue_writing: false
          fail_action: false
          rules_file_name: .zap/rules.tsv
          cmd_options: '-a'
