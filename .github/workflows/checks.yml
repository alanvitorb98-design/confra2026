name: Checks

# Runs on every pull request, so a change only reaches main with lint, unit tests, the build and the
# end-to-end tests green. The end-to-end tests answer the backend themselves and never touch Supabase.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: '1'
      # pictures of the guest's screens against the approved ones in e2e/telas/; a missing one is written
      # and kept in the "telas" file of the run, to be committed (see e2e/telas.visual.ts)
      - run: npm run telas -- --update-snapshots=missing
        env:
          CI: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: telas
          path: |
            e2e/telas
            test-results
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  banco:
    # The database tests: a local Supabase built from supabase/schema.sql, then supabase/tests/*.sql in order.
    # Nothing here touches the real project.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: latest
      - name: Start a local Supabase
        run: |
          # supabase/migrations only holds recent changes, not the whole database: the snapshot below is loaded instead
          mv supabase/migrations "$RUNNER_TEMP/migrations"
          supabase init --force >/dev/null
          supabase start -x studio,imgproxy,mailpit,logflare,vector,edge-runtime,supavisor,postgres-meta
      - name: Load the database
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
      - name: Run the database tests
        run: |
          for f in supabase/tests/*.sql; do
            echo "== $f"
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Run the race tests
        run: bash supabase/tests/corrida.sh
