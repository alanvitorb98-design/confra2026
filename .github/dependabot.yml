# keeps the pinned action commits and npm packages current, one grouped PR a week each
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # big version jumps change how the app builds; those are done by hand with the app tested
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      minor-e-patch:
        update-types: [minor, patch]
